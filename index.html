<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SharperPlus">
<title>SharperPlus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#A66600;         /* sheet background, as the desktop */
  --cell:#BE7F02;       /* gold cells */
  --soft:#F2B705;       /* the small round buttons */
  --line:#4A2E00;       /* tile edges */
  --ink:#1B1B1B;
  --top:#E8A812;        /* menu letters: gold at the top ... */
  --bottom:#62BCE8;     /* ... fading to blue at the bottom */
  --press:#C98A0A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.banner{background:#000 url(banner-phone.png) center/cover no-repeat;aspect-ratio:850/200;width:100%;
  padding-top:env(safe-area-inset-top)}
.wrap{padding:14px 16px 28px;max-width:560px;margin:0 auto}
.tools{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px}
.soft{background:var(--soft);color:var(--ink);font-weight:bold;font-size:16px;border:0;border-radius:12px;
  padding:10px 14px;line-height:1.15;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.soft:active{transform:translateY(1px);box-shadow:none}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:96px;
  border:2px solid var(--line);background:var(--bg);padding:8px 6px;width:100%;
  font:bold clamp(19px,5.4vw,26px)/1.12 Arial,Helvetica,sans-serif;cursor:pointer}
.tile span{display:block;background:linear-gradient(180deg,var(--top) 22%,var(--bottom) 88%);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.tile:active{background:var(--press)}
.title{cursor:default;min-height:72px;margin:0 auto 14px;width:72%}
.title:active{background:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.centre{width:60%;margin:14px auto 0}
.foot{display:flex;justify-content:center;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#FFFFCC;color:var(--ink);border:3px solid var(--soft);border-radius:14px;padding:14px 20px;
  font-weight:bold;font-size:18px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;
  pointer-events:none;transition:opacity .25s;width:max-content;max-width:88vw}
.toast.on{opacity:1}

/* ---- pages */
.page{padding:0 12px 40px;max-width:640px;margin:0 auto}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;padding:10px 0;background:var(--bg)}
.barbtn{background:var(--cell);color:var(--ink);border:2px solid var(--line);border-radius:10px;
  font:bold 17px Arial,sans-serif;padding:10px 14px}
.barbtn.saved{background:#3FA535;color:#fff}
.pagetitle{font:bold 22px/1.2 Arial,sans-serif;margin:6px 2px 14px;color:var(--ink)}
.card{background:var(--cell);border:2px solid var(--line);border-radius:14px;padding:0 0 10px;margin:0 0 16px;overflow:hidden}
.cardhead{background:#EEAF12;color:var(--ink);font:bold 18px Arial,sans-serif;padding:12px 14px;border-bottom:2px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid rgba(0,0,0,.18)}
.row[hidden]{display:none}
.lbl{flex:1;font:bold 15px/1.25 Arial,sans-serif;color:var(--ink)}
.cream{background:#FFFFCC;color:var(--ink);border:2px solid #5A3600;border-radius:9px;font:bold 18px Arial,sans-serif;
  padding:9px 10px;width:42%;max-width:190px;text-align:center}
select.cream{text-align-last:center}
.suffix{font:bold 17px Arial,sans-serif;margin-left:-4px}
.calc{min-width:42%;max-width:190px;text-align:center;background:#FFCC66;border-radius:9px;padding:9px 8px;
  font:bold 17px Arial,sans-serif;color:var(--ink);min-height:40px}
.calc.strong{background:#FFFF00}
.calc.neg,.months .calc.neg{background:#FF0000;color:#fff}
.hint{font:bold 14px Arial,sans-serif;text-align:right;padding:0 12px 6px;color:var(--ink)}
.hint:empty{display:none}
.sub{font:bold 15px Arial,sans-serif;padding:12px 12px 4px;color:var(--ink)}
.note{background:#FFCC66;margin:10px 12px 4px;border-radius:10px;padding:10px;font:bold 15px/1.3 Arial,sans-serif;text-align:center}
.note.red{background:#FF0000;color:#fff}
.small{font:bold 14px/1.35 Arial,sans-serif;padding:10px 12px 0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;padding:8px 12px;justify-content:center}
.btnrow .soft{flex:1;min-width:40%}
.soft.on{background:#FFCC66;outline:3px solid var(--ink)}
.flames{display:flex;gap:10px;padding:6px 12px}
.flame{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:#EEAF12;border:2px solid var(--line);
  border-radius:12px;padding:10px 4px;font:bold 15px/1.2 Arial,sans-serif;color:var(--ink)}
.flame .tick{width:38px;height:38px;background:#fff;border:2px solid var(--ink);border-radius:8px;
  font:bold 26px/34px Arial,sans-serif;color:#0a8a0a}
.months{padding:6px 10px 0}
.month{background:#EEAF12;border:2px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.monthhead{display:flex;justify-content:space-between;align-items:center;background:#000;color:#FFCC66;
  font:bold 18px Arial,sans-serif;padding:10px 12px}
.del{background:#FF0000;color:#fff;border:0;border-radius:8px;font:bold 18px Arial,sans-serif;width:40px;height:36px}
.row.mark .cream{background:#FF6600;color:#fff}
.empty{font:bold 15px/1.35 Arial,sans-serif;padding:12px;text-align:center}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.notice{background:#D69A05;border:4px solid #FFCC66;border-radius:14px;width:100%;max-width:440px;padding:16px}
.notice-head{background:#FFCC66;border:2px solid #000;text-align:center;font:bold 21px Arial,sans-serif;padding:10px;margin-bottom:12px}
.notice-body{font:bold 17px/1.35 Arial,sans-serif;color:#1B1B1B;text-align:center}
.notice-body .cream{width:100%;max-width:none;margin-top:12px}
.notice-btns{display:flex;gap:12px;justify-content:center;margin-top:16px}
.notice-btns .soft{min-width:110px}
.person{background:var(--cell);border:2px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
.personhead{display:flex;gap:10px;align-items:center;background:#000;padding:10px}
.personhead .name{flex:1;width:auto;max-width:none;text-align:left}
.wages{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px}
.wage{display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.wage .lbl{font-size:13px}
.wage .cream,.wage .calc{width:100%;max-width:none;min-width:0;font-size:16px;padding:9px 4px}
.soft.wide{display:block;width:100%;font-size:19px;padding:14px;margin:4px 0 16px}
.ing{background:#EEAF12;border:2px solid var(--line);border-radius:12px;margin:10px 10px 0;overflow:hidden}
.inghead{display:flex;gap:8px;align-items:center;background:#000;padding:8px}
.ingno{color:#FFCC66;font:bold 18px Arial,sans-serif;min-width:26px;text-align:center}
.inghead .ingname{flex:1;width:auto;min-width:0;max-width:none;text-align:left}
.del{flex-shrink:0}
.personhead .name{min-width:0}
.inggrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 10px 4px}
.ingouts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 10px 10px}
.mini{background:#FFCC66;border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;
  font:bold 12px Arial,sans-serif;color:var(--ink);text-align:center}
.mini b{font-size:16px;margin-top:2px;min-height:19px}
.slot{border-top:2px solid var(--line)}
.slothead{background:#FFCC66;font:bold 15px Arial,sans-serif;padding:8px 12px}
.suggest{position:absolute;z-index:40;background:#FFFFCC;border:3px solid #F2B705;border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.35);max-height:50vh;overflow:auto}
.suggestitem{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;
  border-bottom:1px solid rgba(0,0,0,.15);padding:13px 12px;font:bold 17px Arial,sans-serif;color:var(--ink);text-align:left}
.suggestitem:active{background:#F2B705}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="banner" role="img" aria-label="SharperPlus"></div>
<div id="app">
<div class="wrap" id="menu">
  <div class="tools">
    <button class="soft" data-go="LANGUAGE">ENGLISH</button>
    <button class="soft" data-go="CHANGE APPEARANCE">CHANGE<br>APPEARANCE</button>
  </div>

  <div class="tile title"><span>MAIN MENU</span></div>

  <div class="grid">
    <button class="tile" data-go="MASTER COSTINGS"><span>MASTER</span><span>COSTINGS</span></button>
    <button class="tile" data-go="ADD RECIPE FROM PHOTO"><span>ADD RECIPE</span><span>FROM PHOTO</span></button>
    <button class="tile" data-go="STAFF"><span>STAFF</span></button>
    <button class="tile" data-go="ADD RECIPE"><span>ADD RECIPE</span></button>
    <button class="tile" data-go="INGREDIENTS HISTORY"><span>INGREDIENTS</span><span>HISTORY</span></button>
    <button class="tile" data-go="DASHBOARD"><span>DASHBOARD</span></button>
  </div>

  <button class="tile centre" data-go="DATA STORE"><span>DATA STORE</span></button>

  <div class="foot"><button class="soft" data-go="USER GUIDE">USER<br>GUIDE</button></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
